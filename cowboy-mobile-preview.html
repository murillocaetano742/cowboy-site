    * { box-sizing: border-box; }
    body { min-width: 0; margin: 0; }

    button[aria-pressed="true"] { color: #161411; background: #e8bf6a; border-color: #e8bf6a; }
    .device { width: 390px; max-width: 100%; height: min(840px, calc(100vh - 118px)); min-height: 560px; margin: 0 auto; overflow: hidden; outline: 1px solid #736954; outline-offset: 0; background: #0b0907; transition: width 160ms ease-out; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #0b0907; }
    @media (prefers-reduced-motion: reduce) { .device { transition: none; } }
  </style>
</head>
